version: "3.8"

services:
  gesture-training:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TF_TAG: "2.15.0"
        TF_FLAVOR: ""               # ← empty → CPU base image
    volumes:
      - ./dataset:/app/dataset
      - ./training.py:/app/training.py
      - ./exported_model:/app/exported_model