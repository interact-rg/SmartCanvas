[project]
name = "smart_canvas"
version = "0.1.0"
description = "SmartCanvas-project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "moderngl-window==2.4.6",
    "moderngl>=5.12.0",
    "opencv-contrib-python-headless>=4.11.0.86",
    "mediapipe>=0.10.20",
    "numpy>=1.26.4",
    "qrcode>=8.0",
    "requests>=2.32.3",
    "flask-socketio>=5.5.1",
    "gunicorn>=23.0.0",
    "eventlet>=0.39.0",
    "werkzeug>=3.1.3",
    "flask-apscheduler>=1.13.1",
    "flask-httpauth>=4.8.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "scipy>=1.15.1",
    "scikit-learn>=1.6.1",
    "pyrr>=0.10.3",
    "flask>=3.1.0",
]

[dependency-groups]
dev = [
    "pylint>=3.3.4",
    "pytest-cov>=6.0.0",
    "pytest>=8.3.4",
    "pyparsing>=3.2.1",
]

[tool.setuptools]
packages = ["smart_canvas", "web"]
